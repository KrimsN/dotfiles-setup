# Managed by dotfiles-setup.
# Копируется в ~/.tmux.conf модулем modules/tmux.sh. При отличии от уже
# существующего файла делается бэкап (см. tmux::write_config).

# --- TPM (Tmux Plugin Manager) и плагины ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: восстанавливать сессию автоматически при старте сервера
set -g @continuum-restore 'on'

# Базовые удобства
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Инициализация TPM — должна оставаться последней строкой файла
run -b '~/.tmux/plugins/tpm/tpm'
