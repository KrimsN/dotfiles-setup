# Managed by .knrc.
# Копируется в ~/.tmux.conf модулем modules/tmux.sh. При отличии от уже
# существующего файла делается бэкап (см. tmux::write_config).

# --- TPM (Tmux Plugin Manager) и плагины ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-continuum: восстанавливать сессию автоматически при старте сервера
set -g @continuum-restore 'on'
# tmux-resurrect: для окон с nvim восстанавливать не просто рабочую
# директорию, а саму сессию (открытые файлы, разметку) через встроенный
# механизм сессий Vim/Neovim
set -g @resurrect-strategy-nvim 'session'

# Базовые удобства
set -g mouse on
# Нумерация окон/панелей с 1, а не с 0 (0 неудобен — далеко на клавиатуре)
set -g base-index 1
setw -g pane-base-index 1
# После закрытия окна перенумеровать оставшиеся без дырок
set -g renumber-windows on
# Больше строк скроллбэка на панель (дефолт tmux — всего 2000)
set -g history-limit 50000
# Без задержки после Esc — иначе vim/nvim внутри tmux ощутимо тормозит
# на выходе из insert-режима
set -sg escape-time 0
# Дольше показывать сообщения статус-бара (display-message, reload и т.п.)
set -g display-time 3000
# Нужно приложениям внутри tmux (vim, less), чтобы ловить события фокуса панели
set -g focus-events on
# True-color (24-bit), иначе цветовые схемы в терминале/редакторе бледнеют
set -sa terminal-overrides ',xterm-256color:RGB'
set -g default-terminal 'tmux-256color'

# Удобные сплиты (сохраняют текущую директорию) и перезагрузка конфига
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind '%'
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Статус-бар
set -g status-position bottom
# Как часто пересчитывать статус-бар (влияет на точность часов справа)
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 60
set -g status-left '#[fg=green,bold]#S #[fg=default]| '
set -g status-right '#[fg=default]%Y-%m-%d %H:%M #[fg=green,bold]#h'
# *Z у активного окна — индикатор zoom (prefix+z), чтобы не забыть про него
setw -g window-status-current-format '#[fg=green,bold]#I:#W#{?window_zoomed_flag,*Z,}'
setw -g window-status-format '#[fg=default]#I:#W'

# Локальные правки пользователя: этот файл перезаписывается install.sh при
# каждом запуске, поэтому здесь нет места для собственных настроек — они
# подключаются отдельным файлом, который install.sh не трогает. В tmux нет
# условного source-file до версии 3.0, поэтому используем if-shell.
# ВАЖНО: должно оставаться перед инициализацией TPM (см. ниже).
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

# Инициализация TPM — должна оставаться последней строкой файла
run -b '~/.tmux/plugins/tpm/tpm'
