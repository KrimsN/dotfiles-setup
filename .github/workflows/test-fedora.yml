name: Test (Fedora)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sudo
        run: dnf install -y sudo

      - name: install.sh (first run)
        run: NONINTERACTIVE=1 ./install.sh

      - name: install.sh (idempotency check)
        run: NONINTERACTIVE=1 ./install.sh
